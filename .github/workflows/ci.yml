name: CI Safety & Quality Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master", "dev" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. Security & Safety: Secret Scanning and Repository Hygiene
  # ===========================================================================
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Repository Hygiene & Conflict Marker Verification
        run: |
          echo "Scanning for unresolved git conflict markers..."
          ! git grep -nIE '^(<<<<<<< |>>>>>>> )' || (echo "Error: Unresolved conflict markers found" && exit 1)
          echo "Repository hygiene check completed successfully."

  # ===========================================================================
  # 2. HolyNix C11 & HolyC Toolchain, Kernel & TDD Verification Matrix
  # ===========================================================================
  holynix-build-test:
    name: Build & Test (${{ matrix.os }} - ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [clang, gcc]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang gcc make

      - name: Build HolyC Toolchain & Kernel
        env:
          CC: ${{ matrix.compiler }}
        run: |
          make clean
          make all CC=$CC

      - name: Run In-Kernel Subsystem Test Suite (55/55)
        env:
          CC: ${{ matrix.compiler }}
        run: |
          ./bin/holy_unix --test

      - name: Run POSIX & HolyNix TDD Test Suite (270/270)
        env:
          CC: ${{ matrix.compiler }}
        run: |
          $CC -Wall -Wextra -O2 tests/test_linux_kernel.c -o tests/test_linux_kernel -lm
          ./tests/test_linux_kernel

      - name: Run End-to-End Verification Script
        env:
          CC: ${{ matrix.compiler }}
        run: |
          ./tests/run_tests.sh
